name: "Sprint Task"
description: "Task de sprint com vetor + framework + DoD acoplados"
title: "[Sprint X] [Vetor V?] <descrição curta>"
labels: ["type:roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        Use este template para criar tasks de sprint individuais que entram em `docs/ROADMAP-SPRINTS-2026-2027.md`.
        Cada sprint tem ~5-8 tasks distribuídas em 3+ vetores.

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options:
        - "Sprint 1 (11-24/05)"
        - "Sprint 2 (25-05 a 07-06)"
        - "Sprint 3 (08-21/06)"
        - "Sprint 4 (22/06-05/07)"
        - "Sprint 5 (06-19/07)"
        - "Sprint 6 (20/07-02/08)"
        - "Sprint 7 (03-16/08)"
        - "Sprint 8 (17-30/08)"
        - "Sprint 9-10 (31/08-27/09)"
        - "Sprint 11-13 (28/09-08/11)"
        - "Sprint 14-16 (09/11-20/12)"
        - "Sprint 17-20 (21/12-28/02-2027)"
        - "Sprint 21+ (01/03-2027 em diante)"
    validations:
      required: true

  - type: dropdown
    id: vetor
    attributes:
      label: Vetor primário
      options:
        - "V1 — GEO técnico (Schema + llms.txt + robots + sitemap)"
        - "V2 — Engenharia de citação (prompt-âncora + cross-LLM + gap mapping)"
        - "V3 — Editorial HBR-grade (peças + Voice Guard 2.0)"
        - "V4 — Autoridade externa (Wikipedia + Reddit + YouTube + mídia)"
        - "V5 — Moat regional 51 cidades CNPJ-próprio"
        - "Transversal QA & Observability"
        - "Transversal Governança"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework GEO acoplado
      options:
        - "F1 — 9 Enriquecimentos GEO (Aggarwal KDD 2024)"
        - "F2 — AutoGEO Rule-Extraction (Wang ICLR 2026)"
        - "F3 — Structural Feature Engineering (Chen 2025)"
        - "F4 — AgenticGEO Self-Evolving (preprint 2025)"
        - "F5 — Wikipedia + Knowledge Graph"
        - "F6 — Citation Mechanics by Engine"
        - "Não aplica framework específico"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que esta task agora? Qual paper/benchmark/risco sustenta?
      placeholder: |
        Cross-link com `docs/ROADMAP-SPRINTS-2026-2027.md` Sprint X seção.
        Cross-link com `audits/benchmarking/PAPERS-2025-2026-PROFUNDIDADE.md` seção X.
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Use checklist do `docs/gestao/DEFINITION-OF-DONE-CANONICO.md` aplicável
      value: |
        - [ ] DoD A1/A2/A3/... aplicada (especificar qual)
        - [ ] Cross-link para artefato gerado (PR, página, Schema, peça)
        - [ ] Aprovação Bruno quando aplicável
        - [ ] Métrica inicial coletada (quando aplicável)
        - [ ] Sprint board #6 atualizado para Done
    validations:
      required: true

  - type: input
    id: prazo
    attributes:
      label: Prazo intra-sprint
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - "Alexandre Caramaschi"
        - "Bruno Azambuja"
        - "Ronan Maia"
        - "TI IPOG"
        - "Jurídico IPOG"
        - "Sub-agent Opus"
        - "Squad Schema"
        - "Squad Editorial"
        - "Squad Regional"
        - "Squad Autoridade"
        - "Squad Citação"
        - "Squad QA & Observability"
        - "Squad Governança"
    validations:
      required: true
