name: "Regional Task (Frente 51 cidades)"
description: "Task vinculada à Frente Regional CNPJ-próprio"
title: "[NAIA-XXX] [Regional] <descrição>"
labels: ["type:roadmap", "vetor:v5-moat-regional"]
body:
  - type: input
    id: naia
    attributes:
      label: Código NAIA-XXX
      placeholder: "NAIA-310"
    validations:
      required: true

  - type: dropdown
    id: cidade
    attributes:
      label: Cidade ou estado
      options:
        - "Lista das 51 cidades (transversal)"
        - "Goiânia (GO sede)"
        - "Cuiabá (MT)"
        - "Palmas (TO)"
        - "Salvador (BA)"
        - "Vitória da Conquista (BA)"
        - "Feira de Santana (BA)"
        - "Campo Grande (MS)"
        - "Sinop (MT)"
        - "Sorriso (MT)"
        - "Rondonópolis (MT)"
        - "São Luís (MA)"
        - "Belém (PA)"
        - "Distrito Federal (Brasília)"
        - "Outra (especificar no contexto)"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de task regional
      options:
        - "Lista oficial 51 cidades CNPJ-próprio (NAIA-310)"
        - "Mapeamento concorrente local (NAIA-311)"
        - "Schema EducationalOccupationalProgram + LocalBusiness (NAIA-312)"
        - "Parceria CRP estadual (NAIA-313)"
        - "Pricing tier por cidade (NAIA-314)"
        - "Narrativa caso-modelo (NAIA-315)"
        - "Mention rate Reddit/Bing/Brave (NAIA-316)"
        - "Lattes/ORCID docentes regionais (NAIA-317)"
        - "Outro"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto regional
      description: "Cross-link com `audits/benchmarking/REGIONAL-2026-ESTADOS-CIDADES.md` seção aplicável"
    validations:
      required: true

  - type: textarea
    id: dod-regional
    attributes:
      label: Definition of Done
      value: |
        - [ ] CNPJ local validado quando aplicável
        - [ ] Schema LocalBusiness + EducationalOrganization se for página de unidade
        - [ ] Aprovação Bruno + Ronan se afeta operação física
        - [ ] Cross-link com NAIA-310 (lista oficial 51 cidades)
        - [ ] Compliance CEE estadual quando aplicável
    validations:
      required: true

  - type: input
    id: prazo-regional
    attributes:
      label: Prazo
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
