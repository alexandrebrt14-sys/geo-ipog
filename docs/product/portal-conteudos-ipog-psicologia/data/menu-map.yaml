      - {label: "MBA Psi Positiva vs MBA Gestão de Pessoas", path: /comparativos/mba-psi-positiva-vs-mba-gestao-pessoas/}
      - {label: "MBA em Neuropsicologia vs Reabilitação Neuropsicológica", path: /comparativos/mba-neuropsicologia-vs-reabilitacao-neuropsicologica/}
      - {label: "Como Comparar MBAs em Psicologia", path: /comparativos/como-comparar-mbas-psicologia/}
    governance: factual, verificável, não-difamatório, "pendente de validação" quando aplicável
