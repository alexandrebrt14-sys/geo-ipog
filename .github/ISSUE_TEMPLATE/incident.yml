name: Incident
description: Registrar incidente operacional do programa GEO IPOG (SEV1/SEV2).
title: "[incident] "
labels: ["incident", "P0", "needs-triage"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - SEV1 - Bloqueio de captação ou exposição de dado sensível
        - SEV2 - Degradação significativa de mention rate ou indisponibilidade de propriedade IPOG
        - SEV3 - Impacto contido com workaround conhecido
    validations:
      required: true
  - type: input
    id: detected_at
    attributes:
      label: Detectado em (timestamp BRT)
      placeholder: "2026-04-30 14:00 BRT"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Resumo do incidente
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto observado
      description: Sobre quais propriedades IPOG, quais prompts-âncora, quais personas.
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Timeline preliminar
  - type: textarea
    id: containment
    attributes:
      label: Ação de contenção tomada
  - type: textarea
    id: rca_followup
    attributes:
      label: RCA / próximos passos
      description: Causa raiz a investigar. RCA formal exigida em 5 dias úteis para SEV1 e SEV2.
