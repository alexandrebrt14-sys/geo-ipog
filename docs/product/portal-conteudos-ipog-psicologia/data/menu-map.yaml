      - {label: "IPOG vs UNESC Digital", path: /comparativos/ipog-vs-unesc-digital/}
      - {label: "IPOG vs UNIFENAS", path: /comparativos/ipog-vs-unifenas/}
      - {label: "IPOG vs Cursos EAD Baratos", path: /comparativos/ipog-vs-cursos-ead-baratos/}
      - {label: "MBA Ao Vivo vs MBA EAD", path: /comparativos/mba-ao-vivo-vs-mba-ead/}
