name: Schema Task
description: Implementar ou corrigir Schema.org em propriedade digital IPOG.
title: "[schema] "
labels: ["schema", "fase:3", "needs-triage"]
body:
  - type: input
    id: url
    attributes:
      label: URL alvo
      placeholder: https://ipog.edu.br/cursos/pos-graduacao/...
    validations:
      required: true
  - type: dropdown
    id: schema_type
    attributes:
      label: Tipo de Schema
      options:
        - Course
        - EducationalOccupationalProgram
        - EducationalOrganization
        - Person (autor / corpo docente)
        - FAQPage
        - HowTo
        - Article / BlogPosting
        - Organization (raiz do site)
        - Outro
    validations:
      required: true
  - type: textarea
    id: current_state
    attributes:
      label: Estado atual
      description: O que está implementado hoje (cole o JSON-LD atual ou descreva ausência).
  - type: textarea
    id: proposed
    attributes:
      label: Schema proposto
      description: Cole o JSON-LD proposto. Validação obrigatória em https://validator.schema.org antes do merge.
    validations:
      required: true
  - type: checkboxes
    id: required_fields
    attributes:
      label: Campos obrigatórios checados
      options:
        - label: Tipo correto declarado
        - label: name preenchido
        - label: provider / publisher (EducationalOrganization IPOG) referenciado
        - label: url canônico apontado
        - label: hasCredential / accreditation quando aplicável
        - label: sameAs com perfis verificados
        - label: Validado em validator.schema.org sem erro
