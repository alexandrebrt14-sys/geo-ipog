name: Audit Finding
description: Registrar achado de auditoria GEO/SEO/Schema em propriedade digital IPOG.
title: "[audit] "
labels: ["auditoria", "fase-1", "prioridade-media"]
body:
  - type: input
    id: property
    attributes:
      label: Propriedade digital
      description: URL ou domínio onde o achado foi observado.
      placeholder: https://ipog.edu.br/cursos/pos-graduacao
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - P0 - Bloqueador para o pico de captação
        - P1 - Alta - reduz mention rate ou share-of-voice
        - P2 - Média - melhoria incremental
        - P3 - Baixa - higiene técnica
    validations:
      required: true
  - type: dropdown
    id: lever
    attributes:
      label: Alavanca dominante
      options:
        - Conteúdo editorial
        - Schema.org / structured data
        - Autoridade externa
        - Sinais técnicos (robots, sitemap, llms.txt)
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Descrição do achado
      description: O que foi encontrado, como foi encontrado, qual a evidência (NAIA score, validator output, snapshot).
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto estimado
      description: Sobre quais prompts-âncora, personas ou clusters semânticos isso afeta o IPOG.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposta de correção
  - type: input
    id: owner
    attributes:
      label: Owner sugerido
      description: Quem é o responsável natural por executar a correção.
