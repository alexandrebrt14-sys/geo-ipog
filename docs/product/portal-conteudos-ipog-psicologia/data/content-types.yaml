# Tipos de conteúdo canônicos — Portal de Conteúdos IPOG Psicologia
# Versão: 1.0 (Wave 2 · 2026-05-10)

content_types:

  artigo:
    description: "Texto curto/médio (800-1500 palavras) com tese + evidência + ação"
    schema_org: Article
    typical_length_words: [800, 1500]
    required_fields: [title, summary, body, author, publish_date, primary_topics, sources]
    typical_journey_stage: [awareness, problem-discovery]
    primary_cta_type: [baixar-material, inscrever-webinar]

  guia-completo:
    description: "Conteúdo profundo (1500-4000 palavras) com FAQ + checklist + cross-link a curso"
    schema_org: HowTo
    typical_length_words: [1500, 4000]
    required_fields: [title, summary, body, table_of_contents, faq_attached, primary_topics, related_courses, sources, last_updated]
    typical_journey_stage: [problem-discovery, solution-discovery, consideration]
    primary_cta_type: [baixar-material, agendar-conversa]

  pilar-seo:
    description: "Conteúdo-âncora (3000-7000 palavras) que ranqueia para query high-volume + linka para clusters"
    schema_org: Article
    typical_length_words: [3000, 7000]
    required_fields: [title, summary, body, table_of_contents, internal_links_to_cluster, primary_seo_keyword, related_courses, sources]
    typical_journey_stage: [awareness, consideration]
    primary_cta_type: [baixar-material, comparar-cursos]

  landing-page:
    description: "Página focada em conversão para um curso ou tema"
    schema_org: WebPage
    required_fields: [headline, value_proposition, hero_section, conversion_module, primary_cta, secondary_cta, social_proof, faq]
    typical_journey_stage: [decision, enrollment]
    primary_cta_type: [agendar-conversa, fazer-inscricao, iniciar-matricula]

  pagina-curso:
    description: "Página detalhada de um curso (MBA POT, MBA Psi Positiva, etc.)"
    schema_org: [Course, EducationalOccupationalProgram]
    required_fields: [course_name, modality, duration, target_personas, full_description, modules, professors, capstone, certificate, mec_authorization, cfp_compliance, primary_cta, lead_form, faq, testimonials, related_content, state_variants]
    typical_journey_stage: [consideration, comparison, decision]
    primary_cta_type: [solicitar-grade, agendar-conversa, ver-investimento, iniciar-matricula]

  pagina-estado:
    description: "Página por UF — captura demanda local com cursos + termos SEO locais"
    schema_org: [WebPage, Place]
    required_fields: [state_name, state_uf, region, courses_priority, local_topics, local_evidence, ipog_units_in_state, local_competitors_mentioned, local_ctas]
    typical_journey_stage: [awareness, consideration, local]
    primary_cta_type: [agendar-conversa, falar-whatsapp]

  pagina-cidade:
    description: "Página por cidade média (subset Frente Regional 51 cidades CNPJ-próprio)"
    schema_org: [WebPage, Place, EducationalOrganization]
    required_fields: [city_name, parent_state, has_cnpj_local_unit, local_unit_address_if_applicable, courses_priority, local_evidence, local_ctas]
    typical_journey_stage: [decision, local]
    primary_cta_type: [falar-whatsapp, agendar-conversa, iniciar-matricula]

  pagina-comparativa:
    description: "Comparativo factual entre IPOG e concorrente / entre formatos / entre cursos"
    schema_org: Article
    required_fields: [comparison_subject, comparison_targets, comparison_criteria, comparison_matrix, ipog_advantage_summary, evidence_sources, validation_status]
    typical_journey_stage: [comparison, decision]
    primary_cta_type: [comparar-cursos, agendar-conversa]
    governance_notes: "Comparativo deve ser factual, verificável, não-difamatório. Quando dado não disponível: registrar como 'não identificado publicamente'."

  faq:
    description: "Pergunta + resposta canônica vinculada a curso, tema ou jornada"
    schema_org: [FAQPage, Question, Answer]
    required_fields: [question, answer, related_courses, related_topics, journey_stage, last_validated_date]
    typical_journey_stage: [problem-discovery, consideration, decision]

  checklist:
    description: "Lista executável (10-30 itens) com vínculo a tema/curso"
    schema_org: HowTo
    required_fields: [title, items, related_topics, related_courses]
    typical_journey_stage: [solution-discovery, consideration]
    primary_cta_type: [baixar-material]

  quiz:
    description: "Ferramenta interativa de descoberta — captura lead exploratório"
    schema_org: [Quiz, LearningResource]
    required_fields: [questions, scoring_logic, recommended_courses_by_score, lead_capture_form]
    typical_journey_stage: [problem-discovery, solution-discovery]
    primary_cta_type: [fazer-quiz]
    canonical_quiz: "Qual MBA em Psicologia combina com você?"

  e-book:
    description: "PDF rico (15-50 páginas) com lead form gating"
    schema_org: DigitalDocument
    required_fields: [title, abstract, table_of_contents, file_url, lead_form_id, target_personas]
    typical_journey_stage: [awareness, problem-discovery]
    primary_cta_type: [baixar-material]

  webinar:
    description: "Evento ao vivo online com captura via inscrição"
    schema_org: Event
    required_fields: [title, scheduled_date, duration, speakers, target_personas, lead_form_id, recording_url_after]
    typical_journey_stage: [consideration, comparison]
    primary_cta_type: [inscrever-webinar]

  aula-aberta:
    description: "Amostra de aula gravada ou ao vivo — prova de qualidade da experiência"
    schema_org: [VideoObject, LearningResource]
    required_fields: [title, course_id, duration, professor, recording_url]
    typical_journey_stage: [consideration, comparison, decision]
    primary_cta_type: [assistir-aula-aberta, agendar-conversa]

  case:
    description: "Estudo de caso de empresa (anonimizada ou nominal com permissão)"
    schema_org: Article
    required_fields: [company_name_or_anonymized, sector, challenge, solution, indicators_before, indicators_after, lessons, related_courses, permission_to_publish]
    typical_journey_stage: [problem-discovery, consideration]

  entrevista:
    description: "Conversa com docente/egresso/especialista (texto, áudio ou vídeo)"
    schema_org: [Article, VideoObject, AudioObject]
    required_fields: [interviewee, role, key_quotes, summary, full_content_url]
    typical_journey_stage: [awareness, consideration]

  glossario:
    description: "Termo técnico com definição + exemplos"
    schema_org: DefinedTerm
    required_fields: [term, aliases, definition, category, examples, related_terms, related_courses]
    typical_journey_stage: [problem-discovery]

  ferramenta:
    description: "Aplicação interativa client-side"
    schema_org: SoftwareApplication
    required_fields: [tool_name, description, inputs, outputs, interpretation, related_courses, disclaimer]
    typical_journey_stage: [solution-discovery, consideration]

  diagnostico:
    description: "Avaliação progressiva com score + plano de ação personalizado"
    schema_org: [Quiz, LearningResource]
    required_fields: [questions, dimensions, scoring_model, recommended_actions, recommended_courses_by_score]
    typical_journey_stage: [problem-discovery, solution-discovery]
    primary_cta_type: [fazer-quiz, agendar-conversa]

  calculadora:
    description: "Calculadora client-side (ex: ROI de NR-1, CAC de RH, LTV de programa de bem-estar)"
    schema_org: [SoftwareApplication, HowTo]
    required_fields: [calculator_name, inputs, formula, output_visualization, interpretation, related_courses, disclaimer]
    typical_journey_stage: [consideration, decision]

  infografico:
    description: "Imagem rica com dados visuais + CTA"
    schema_org: ImageObject
    required_fields: [image_url, alt_text, full_text_alternative, related_topics, related_courses]
    typical_journey_stage: [awareness, problem-discovery]

  roteiro-carreira:
    description: "Trilha narrativa por persona — 5-15 passos por persona com cursos + conteúdos"
    schema_org: [Article, LearningResource]
    required_fields: [career_track_name, target_persona, steps, courses_recommended_by_step, content_recommended_by_step]
    typical_journey_stage: [problem-discovery, solution-discovery, consideration]
    primary_cta_type: [agendar-conversa]
