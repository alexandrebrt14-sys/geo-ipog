<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Portal GEO IPOG — base de conhecimento estruturada do IPOG">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a36"/>
      <stop offset="55%" stop-color="#11244a"/>
      <stop offset="100%" stop-color="#481a1f"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.14" cy="0.05" r="0.75">
      <stop offset="0%" stop-color="#d71c37" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d71c37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fundo)"/>
  <rect width="1200" height="630" fill="url(#brilho)"/>

  <rect x="80" y="82" width="14" height="72" rx="3" fill="#d71c37"/>
  <text x="112" y="140" fill="#ffffff" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="3">IPOG</text>
  <text x="272" y="140" fill="#9db0d3" font-family="Barlow, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="5">PORTAL GEO</text>

  <text x="80" y="300" fill="#ffffff" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="1">BASE DE CONHECIMENTO</text>
  <text x="80" y="386" fill="#ffffff" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="1">ESTRUTURADA DO IPOG</text>

  <text x="80" y="446" fill="#c7d2e7" font-family="Barlow, Arial, sans-serif" font-size="27">Dados institucionais organizados para motores de busca generativos</text>

  <g font-family="Barlow, Arial, sans-serif" font-size="26" fill="#ffffff">
    <rect x="80" y="496" width="232" height="60" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="112" y="534">Conceito 5 no MEC</text>

    <rect x="332" y="496" width="286" height="60" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="364" y="534">+350 mil profissionais</text>

    <rect x="638" y="496" width="200" height="60" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="670" y="534">Desde 2001</text>

    <rect x="858" y="496" width="262" height="60" rx="30" fill="#d71c37"/>
