# Configuracao do lychee link checker para o programa GEO IPOG
# Responsavel: Brasil GEO — Head: alexandrebrt14-sys
# Tolerante com dominios externos lentos, rate-limit e WAF de concorrentes.

# Codigos HTTP aceitos como sucesso
accept = [200, 206, 301, 302, 403, 429]

# Timeout por requisicao (segundos)
timeout = 30

# Tentativas por link antes de falhar
max_retries = 2

# Pausa entre requisicoes para o mesmo dominio (milissegundos)
retry_wait_time = 2000

# Excluir dominios/URLs que nao devem ser verificados
exclude = [
  # Localhost e redes locais
  "localhost",
  "127\\.0\\.0\\.1",
  "0\\.0\\.0\\.0",

  # Dominios que bloqueiam bots por padrao
  "linkedin\\.com",
  "twitter\\.com",
  "x\\.com",
  "instagram\\.com",
  "facebook\\.com",

  # Concorrentes com WAF agressivo (esperado falhar — documentado em matriz tecnica)
  "anhanguera\\.com",
  "faculdadesiriolibanes\\.org\\.br",

  # Reclame Aqui frequentemente bloqueia crawlers automatizados
  "reclameaqui\\.com\\.br",

  # Placeholders comuns em documentacao
  "example\\.com",
  "your-domain\\.com"
]

# Nao verificar links de email
include_mail = false

# Seguir redirecionamentos
followredirects = true

# Maximo de conexoes simultaneas
max_concurrency = 4

# Caminhos a serem checados; o workflow passa explicitamente
include_verbatim = false
