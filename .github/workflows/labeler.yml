# Workflow: Auto-aplicacao de Labels por Caminho
# Responsavel: Brasil GEO — Head: alexandrebrt14-sys
# Aplica labels automaticamente em PRs com base nos arquivos alterados.
# Regras de mapeamento definidas em .github/labeler.yml

name: "Auto-Labeler de PRs"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: "Aplicar labels por caminho alterado"
    runs-on: ubuntu-latest
    steps:
      - name: "Aplicar labels automaticos"
        uses: actions/labeler@v6
        with:
          configuration-path: ".github/labeler.yml"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
