# Menu map canônico — Portal de Conteúdos IPOG Psicologia
# Versão: 1.0 (Wave 3 · 2026-05-10)
# Cross-link: 06-menus-e-submenus.md

menus:

  inicio:
    label: Início
    path: /
    objective: "Apresentar IPOG como referência + conduzir para curso/tema/persona/estado"
    primary_persona: all
    intent: awareness, navegacional
    submenus_visible_on_home:
      - destaques
      - escolha_seu_mba
      - temas_em_alta
      - guia_por_perfil
      - guia_por_estado
      - comparativos
      - recursos_gratuitos
      - fale_com_consultor
    primary_cta: fazer-quiz
    secondary_cta: ver-mbas-em-psicologia
    analytics: [home_view, home_section_clicked, home_cta_primary_clicked]
    schema_org: [Organization, WebSite, SearchAction]
    roadmap: fase-1-mvp

  mbas_em_psicologia:
    label: MBAs em Psicologia
    path: /mba-psicologia/
    objective: "Captar leads para os 5 MBAs prioritários + conduzir comparação"
    primary_persona: psicologo, rh-nao-psicologo, lider, consultor
    intent: solution-discovery, consideration, mba
    submenus:
      - {label: "Todos os MBAs em Psicologia", path: /mba-psicologia/, type: hub}
      - {label: "MBA em Psicologia Organizacional e do Trabalho", path: /mba-psicologia/psicologia-organizacional/, is_flagship: true, persona: [psicologos, rh-nao-psicologo, consultores]}
      - {label: "MBA em Psicologia Positiva, Saúde Mental e Gestão do Bem-Estar", path: /mba-psicologia/psicologia-positiva-bem-estar/, persona: [psicologos, rh-nao-psicologo]}
      - {label: "MBA em Reabilitação Neuropsicológica e Desenvolvimento Cognitivo", path: /mba-psicologia/reabilitacao-neuropsicologica/, persona: [psicologos-clinicos, profissionais-saude]}
      - {label: "MBA em Neurociência e Psicologia Positiva", path: /mba-psicologia/neurociencia-psicologia-positiva/, persona: [psicologos, profissionais-saude, profissionais-educacao]}
      - {label: "MBA em Gestão de Pessoas e Liderança Positiva", path: /mba-psicologia/gestao-pessoas-lideranca-positiva/, persona: [profissionais-rh, lideres]}
      - {label: "Comparar MBAs", path: /comparativos/comparar-mbas-psicologia/, type: comparativo}
      - {label: "Qual MBA escolher?", path: /quiz/qual-mba-em-psicologia-combina-com-voce/, type: quiz}
    primary_cta_per_submenu:
      hub: fazer-quiz
      mba_pages: solicitar-grade
      comparativo: agendar-conversa
      quiz: fazer-quiz
    schema_org: Course, EducationalOccupationalProgram
    roadmap: fase-1-mvp

  temas_em_alta:
    label: Temas em Alta
    path: /temas/
    objective: "Capturar tráfego SEO em temas-chave 2025-2026 e conduzir a cursos"
    primary_persona: all
    intent: informacional, regulatorio, tendencia, como-fazer
    submenus:
      - {label: "NR-1 e Riscos Psicossociais", path: /temas/nr-1-riscos-psicossociais/, hot: true}
      - {label: "Saúde Mental no Trabalho", path: /temas/saude-mental-no-trabalho/, hot: true}
      - {label: "Psicologia Organizacional e do Trabalho", path: /temas/psicologia-organizacional-trabalho/}
      - {label: "Psicologia Positiva", path: /temas/psicologia-positiva/}
      - {label: "Neurociência Aplicada", path: /temas/neurociencia-aplicada/}
      - {label: "People Analytics", path: /temas/people-analytics/, hot: true}
      - {label: "IA em RH", path: /temas/ia-em-rh/, hot: true}
      - {label: "Liderança Positiva", path: /temas/lideranca-positiva/}
      - {label: "Segurança Psicológica", path: /temas/seguranca-psicologica/}
      - {label: "Clima e Cultura Organizacional", path: /temas/clima-cultura-organizacional/}
      - {label: "Burnout e Prevenção", path: /temas/burnout-prevencao/}
      - {label: "Reabilitação Neuropsicológica", path: /temas/reabilitacao-neuropsicologica/}
      - {label: "Avaliação Psicológica", path: /temas/avaliacao-psicologica/}
      - {label: "Desenvolvimento Cognitivo", path: /temas/desenvolvimento-cognitivo/}
    primary_cta: baixar-material, inscrever-webinar
    schema_org: Article (pillar SEO)

  para_quem:
    label: Para Quem
    path: /para-quem/
    objective: "Capturar leads por perfil profissional"
    primary_persona: all (segmentado)
    intent: carreira, comercial
    submenus:
      - {label: "Para Psicólogos", path: /para-quem/psicologos/, persona: psicologos}
      - {label: "Para Psicólogos Clínicos", path: /para-quem/psicologos-clinicos/, persona: psicologos-clinicos}
      - {label: "Para Profissionais de RH", path: /para-quem/rh/, persona: profissionais-rh}
      - {label: "Para Líderes e Gestores", path: /para-quem/lideres/, persona: lideres}
      - {label: "Para Consultores", path: /para-quem/consultores/, persona: consultores}
      - {label: "Para Profissionais da Saúde", path: /para-quem/saude/, persona: profissionais-saude}
      - {label: "Para Profissionais da Educação", path: /para-quem/educacao/, persona: profissionais-educacao}
      - {label: "Para Quem Quer Mudar de Carreira", path: /para-quem/transicao-carreira/, persona: transicao-carreira}
      - {label: "Para Quem Quer Atuar em Empresas", path: /para-quem/atuar-em-empresas/}
      - {label: "Para Quem Quer Ampliar Consultório", path: /para-quem/ampliar-consultorio/}
    primary_cta: agendar-conversa, fazer-quiz

  por_estado:
    label: Por Estado
    path: /por-estado/
    objective: "Capturar demanda local SEO + presença regional"
    primary_persona: all (segmentado por estado)
    intent: local, comercial
    submenus:
      hub: {label: "MBAs em Psicologia no Brasil", path: /por-estado/}
      states_27:
        - {uf: ac, name: "Acre", region: norte}
        - {uf: al, name: "Alagoas", region: nordeste}
        - {uf: ap, name: "Amapá", region: norte}
        - {uf: am, name: "Amazonas", region: norte}
        - {uf: ba, name: "Bahia", region: nordeste, frente_regional: true}
        - {uf: ce, name: "Ceará", region: nordeste}
        - {uf: df, name: "Distrito Federal", region: centro-oeste, frente_regional: true}
        - {uf: es, name: "Espírito Santo", region: sudeste}
        - {uf: go, name: "Goiás", region: centro-oeste, ipog_sede: true, frente_regional: true}
        - {uf: ma, name: "Maranhão", region: nordeste, frente_regional: true}
        - {uf: mt, name: "Mato Grosso", region: centro-oeste, frente_regional: true}
        - {uf: ms, name: "Mato Grosso do Sul", region: centro-oeste, frente_regional: true}
        - {uf: mg, name: "Minas Gerais", region: sudeste}
        - {uf: pa, name: "Pará", region: norte, frente_regional: true}
        - {uf: pb, name: "Paraíba", region: nordeste}
        - {uf: pr, name: "Paraná", region: sul}
        - {uf: pe, name: "Pernambuco", region: nordeste}
        - {uf: pi, name: "Piauí", region: nordeste}
        - {uf: rj, name: "Rio de Janeiro", region: sudeste}
        - {uf: rn, name: "Rio Grande do Norte", region: nordeste}
        - {uf: rs, name: "Rio Grande do Sul", region: sul}
        - {uf: ro, name: "Rondônia", region: norte}
        - {uf: rr, name: "Roraima", region: norte}
        - {uf: sc, name: "Santa Catarina", region: sul}
        - {uf: sp, name: "São Paulo", region: sudeste}
        - {uf: se, name: "Sergipe", region: nordeste}
        - {uf: to, name: "Tocantins", region: norte, frente_regional: true}
    sub_pages_per_state:
      - /por-estado/{uf}/{slug-curso}/        # 5 cursos x 27 = 135 páginas
      - /por-estado/{uf}/temas/{slug-tema}/   # 3-5 temas x 27 = 80-135 páginas
      - /por-estado/{uf}/{slug-cidade}/       # 51 cidades médias

  comparativos:
    label: Comparativos
    path: /comparativos/
    objective: "Capturar tráfego comparativo + decisão de matrícula"
    primary_persona: comparativo, exploratório
