# Templates SEO programáticos — Portal de Conteúdos IPOG Psicologia
# Versão: 1.0 (Wave 4 · 2026-05-10)
# Cross-link: 09-seo-e-conteudo-programatico.md

page_types:

  hub_mbas:
    path_pattern: "/mba-psicologia/"
    objective: "Listar todos MBAs em Psicologia + conduzir comparação"
    intent: navegacional, comercial
    seo_title: "MBAs em Psicologia Online — Especializações Lato Sensu | IPOG"
    meta_description: "Conheça os MBAs em Psicologia do IPOG. Online ao vivo, 12 meses, MEC. Psicologia Organizacional, Positiva, Neuropsicológica, Neurociência e Gestão de Pessoas."
    h1: "MBAs em Psicologia"
    h2_required:
      - "Para quem são os MBAs em Psicologia do IPOG"
      - "5 MBAs prioritários"
      - "Como escolher o seu MBA"
      - "Comparativo entre os MBAs"
      - "Próximas turmas"
    minimum_content_words: 1200
    schema: [CollectionPage, BreadcrumbList]
    canonical_rule: absolute_url_no_query
    update_frequency: trimestral

  curso_individual:
    path_pattern: "/mba-psicologia/{slug-curso}/"
    objective: "Captar lead qualificado + conduzir matrícula"
    intent: comercial, transacional, comparativa
    seo_title: "MBA em [Cluster] — Online ao Vivo | IPOG"
    meta_description: "Especialização Lato Sensu reconhecida pelo MEC. 12 meses, online ao vivo, [diferencial]. Confira matriz curricular, professores e investimento."
    h1: "MBA em [Cluster Completo]"
    h2_required:
      - "Para quem é este MBA"
      - "O que você vai aprender"
      - "Matriz curricular"
      - "Professores"
      - "Capstone executivo"
      - "Certificação"
      - "Como funciona o online ao vivo"
      - "Próxima turma e investimento"
      - "Perguntas frequentes"
    minimum_content_words: 1500
    conversion_modules:
      - "Solicitar matriz curricular completa" (lead form)
      - "Agendar conversa com coordenação" (high-intent)
      - "Falar no WhatsApp" (sticky)
      - "Iniciar matrícula" (transacional)
    schema: [Course, EducationalOccupationalProgram, FAQPage, BreadcrumbList]
    canonical_rule: absolute_url_no_query
    update_frequency: trimestral
    governance_notes: "Capstone executivo + naming canônico + compliance MEC + CFP visível"

  hub_temas:
    path_pattern: "/temas/"
    objective: "Listar 14 temas-chave 2025-2026"
    intent: navegacional, informacional
    seo_title: "Temas em Alta em Psicologia Aplicada — 2026 | IPOG"
    minimum_content_words: 1000
    schema: [CollectionPage, BreadcrumbList]

  tema_pillar:
    path_pattern: "/temas/{slug-tema}/"
    objective: "Pillar SEO + lead magnet + cross-link curso"
    intent: informacional, regulatório, tendência, como-fazer
    seo_title: "[Tema] — Guia Completo 2026 | IPOG"
    meta_description: "Tudo sobre [tema] em 2026: o que é, como aplicar, regulação, exemplos práticos. Guia preparado por especialistas IPOG."
    h1: "[Tema]: o que é, como aplicar e o que muda em 2026"
    h2_required:
      - "[Tema]: definição e contexto 2026"
      - "Por que [tema] é prioridade agora"
      - "Como aplicar [tema] na prática"
      - "Casos reais"
      - "Regulação aplicável (quando relevante)"
      - "MBAs do IPOG que abordam [tema]"
      - "Lead magnet: baixar guia completo"
      - "Perguntas frequentes"
    minimum_content_words: 3000
    conversion_modules:
      - "Baixar guia completo de [tema] em PDF" (lead magnet)
      - "Inscrever em webinar sobre [tema]"
      - "Conhecer MBA do IPOG que aborda [tema]"
    schema: [Article, FAQPage, BreadcrumbList]
    update_frequency: trimestral_para_regulatorios; semestral_demais
    governance_notes: "≥ 5 sources tier-1/tier-2; data_validade obrigatório; revisão jurídica para temas regulatórios"

  hub_personas:
    path_pattern: "/para-quem/"
    objective: "Listar 12 perfis profissionais"
    intent: navegacional
    minimum_content_words: 800
    schema: [CollectionPage, BreadcrumbList]

  persona_individual:
    path_pattern: "/para-quem/{slug-persona}/"
    objective: "Narrativa de carreira + cursos recomendados"
    intent: carreira, comercial
    seo_title: "MBA em Psicologia para [Persona] | IPOG"
    h1: "MBA em Psicologia para [Persona]: caminho ideal de carreira"
    h2_required:
      - "Quem é o(a) [persona]"
      - "Dores comuns no momento atual"
      - "Como o MBA do IPOG resolve"
      - "Cursos recomendados em ordem de prioridade"
      - "Trilha de carreira sugerida"
      - "Cases de [persona] que cursaram"
      - "FAQ específico"
    minimum_content_words: 1500
    schema: [Article, BreadcrumbList]

  hub_geo:
    path_pattern: "/por-estado/"
    objective: "Apresentar capilaridade nacional + 27 UFs"
    intent: local, navegacional
    minimum_content_words: 1000
    schema: [CollectionPage, BreadcrumbList]

  estado_uf:
    path_pattern: "/por-estado/{uf}/"
    objective: "Capturar demanda local SEO"
    intent: local, comercial
    seo_title: "MBAs em Psicologia em [Estado] | IPOG"
    meta_description: "MBAs em Psicologia para profissionais de [Estado]. Online ao vivo, MEC, IPOG. Confira opções, turmas e investimento adequado ao seu estado."
    h1: "MBAs em Psicologia em [Estado]"
    h2_required:
      - "Por que estudar Psicologia aplicada em [Estado]"
      - "Mercado de trabalho em [Estado]"
      - "Cursos prioritários para [Estado]"
      - "Cidades com presença IPOG (quando Frente Regional)"
      - "Próximas turmas online"
      - "Falar com consultor regional"
    minimum_content_words: 800
    conversion_modules:
      - "Falar com consultor regional via WhatsApp"
      - "Conhecer cidades com presença IPOG"
    schema: [WebPage, Place, BreadcrumbList]
    governance_notes: "DADOS LOCAIS REAIS obrigatórios — anti-thin-content. Quando dado não disponível: 'pendente de pesquisa' + omitir."
    update_frequency: semestral

  estado_curso:
    path_pattern: "/por-estado/{uf}/{slug-curso}/"
    objective: "SEO local específico de curso"
    intent: local, comercial, comparativa
    seo_title: "MBA em [Cluster] em [Estado] — Online ao Vivo | IPOG"
    h1: "MBA em [Cluster] para profissionais de [Estado]"
    minimum_content_words: 1000
    schema: [Course, EducationalOccupationalProgram, Place, areaServed, BreadcrumbList]
    governance_notes: "Localizar matriz + professores + cases pelo Estado"

  estado_tema:
    path_pattern: "/por-estado/{uf}/temas/{slug-tema}/"
    objective: "SEO local em tema específico"
    intent: local, informacional
    minimum_content_words: 1200
    schema: [Article, Place, BreadcrumbList]

  estado_cidade:
    path_pattern: "/por-estado/{uf}/{slug-cidade}/"
    objective: "Captura local em cidade Frente Regional"
    intent: local, comercial
    h1: "MBAs em Psicologia em [Cidade] - [Estado]"
    minimum_content_words: 800
    schema: [WebPage, Place, EducationalOrganization (CNPJ-próprio), BreadcrumbList]
    governance_notes: "Aplicável apenas quando há unidade IPOG local (NAIA-310)"

  hub_comparativos:
    path_pattern: "/comparativos/"
    objective: "Listar 12+ comparativos factuais"
    intent: navegacional, comparativa
    minimum_content_words: 800

  comparativo_ipog_vs_concorrente:
    path_pattern: "/comparativos/ipog-vs-{slug-concorrente}/"
    objective: "Capturar tráfego comparativo + decisão"
    intent: comparativa, decisão
    seo_title: "IPOG vs [Concorrente]: comparativo factual de MBA em Psicologia"
    h1: "IPOG vs [Concorrente]: como comparar MBAs em Psicologia"
    h2_required:
      - "Resumo executivo da comparação"
      - "Critérios da comparação"
      - "Matriz comparativa"
      - "Onde IPOG tem vantagem"
      - "Onde [Concorrente] tem vantagem"
      - "Considerações finais"
    minimum_content_words: 2000
    schema: [Article, BreadcrumbList]
    governance_notes: "FACTUAL + verificável + não-difamatório. Cada linha com validation_status. Gate jurídico antes do publish."

  quiz_qual_mba:
    path_pattern: "/quiz/qual-mba-em-psicologia-combina-com-voce/"
    objective: "Captura de lead exploratório + recomendação"
    intent: informacional + decisão
    schema: [Quiz, LearningResource]
    conversion_modules:
      - "Ver resultado + recomendação personalizada"
      - "Receber e-mail com plano sugerido (lead capture)"

  glossario_termo:
    path_pattern: "/glossario/{slug-termo}/"
    objective: "SEO long-tail + cross-link curso/tema"
    intent: informacional, como-fazer
    seo_title: "[Termo]: definição, exemplos e aplicação | IPOG Glossário"
    h1: "[Termo]: o que é e como se aplica"
    minimum_content_words: 600
    schema: [DefinedTerm, BreadcrumbList]

  recurso_individual:
    path_pattern: "/recursos/{tipo}/{slug-recurso}/"
    objective: "Lead magnet + captura"
    intent: informacional
    schema: [DigitalDocument | Event | LearningResource, BreadcrumbList]
