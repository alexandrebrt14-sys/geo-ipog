name: Content Piece (HBR-grade)
description: Briefing de uma peça editorial padrão HBR para o programa GEO IPOG.
title: "[content] "
labels: ["content", "fase:3", "needs-triage"]
body:
  - type: input
    id: working_title
    attributes:
      label: Título de trabalho
    validations:
      required: true
  - type: dropdown
    id: cluster
    attributes:
      label: Cluster semântico
      options:
        - Psicologia organizacional / do trabalho / RH
        - Psicologia clínica / TCC / neuropsicologia / avaliação
        - Psicopedagogia / psicologia escolar / educação
        - Decisão de carreira / ROI de pós / regulamentação CFP
        - Tendências de mercado / saúde mental corporativa
    validations:
      required: true
  - type: input
    id: anchor_prompt
    attributes:
      label: Prompt-âncora alvo (do kit GEO)
      placeholder: "Qual o melhor MBA online em Psicologia Organizacional reconhecido pelo MEC?"
    validations:
      required: true
  - type: textarea
    id: thesis
    attributes:
      label: Tese contraintuitiva
      description: O insight não-óbvio central que a peça vai defender.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências previstas
      description: Dados, pesquisas, fontes externas (CFP, ABEP, IBGE, INEP, MEC, periódicos).
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Mecanismo
      description: Por que o fenômeno descrito ocorre.
  - type: input
    id: signature
    attributes:
      label: Assinatura
      description: Autor previsto. Se Alexandre Caramaschi, exige Voice Guard antes da publicação.
  - type: input
    id: target_publish
    attributes:
      label: Data alvo de publicação
      placeholder: YYYY-MM-DD
  - type: textarea
    id: schema
    attributes:
      label: Schema.org previsto
      description: Article, FAQPage, HowTo, Person (autor com credenciais), etc.
