name: Citation Gap
description: Registrar gap entre resposta atual de um LLM e a resposta-alvo definida pelo programa GEO IPOG.
title: "[citation-gap] "
labels: ["auditoria", "monitoramento", "prioridade-media"]
body:
  - type: input
    id: prompt
    attributes:
      label: Prompt-âncora
      placeholder: "Qual o melhor MBA online em Psicologia Organizacional reconhecido pelo MEC?"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provedor LLM
      options:
        - ChatGPT
        - Claude
        - Gemini
        - Perplexity
        - Grok
        - Copilot
        - Cross-LLM
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Persona afetada
      options:
        - Psicólogo recém-graduado
        - Psicólogo clínico estabelecido
        - Profissional de RH não-psicólogo
        - Profissional de saúde
        - Educador / pedagogo
        - Transição de carreira
        - Coach / terapeuta complementar
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Resposta atual observada
      description: Cole a resposta atual do LLM. Inclua data, versão de modelo se disponível.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Resposta-alvo
      description: Como o IPOG deveria aparecer na resposta. Mencione carga horária, formato, autorização MEC, diferenciais e corpo docente quando aplicável.
    validations:
      required: true
  - type: dropdown
    id: lever
    attributes:
      label: Alavanca dominante para fechar o gap
      options:
        - Conteúdo editorial
        - Schema.org
        - Autoridade externa (PR, mídia, Wikipedia, CFP, MEC)
        - Combinação
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plano de fechamento proposto
