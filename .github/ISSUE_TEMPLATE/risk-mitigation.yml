name: "Risk Mitigation"
description: "Issue de mitigação de risco catalogado R-001 a R-019"
title: "[Risk R-XXX] <descrição da mitigação>"
labels: ["type:governance"]
body:
  - type: dropdown
    id: risco
    attributes:
      label: Risco catalogado
      description: "Lista canônica em `docs/05-risk-register.md`"
      options:
        - "R-001 — Atraso decisão produto IPOG (em escalada)"
        - "R-002 — Concorrente publica llms.txt antes do IPOG (mitigado)"
        - "R-003 — Sírio-Libanês/Anhanguera desbloqueia WAF (mitigado)"
        - "R-004 — Anhembi adiciona Person Schema com Lattes (mitigado)"
        - "R-005 — PUC-Minas reabre Psicologia EAD (aceito)"
        - "R-006 — Mudança silenciosa de versão LLM (mitigado)"
        - "R-007 — Especialistas Psi fora do mapa atual aceleram GEO (mitigado)"
        - "R-008 — Wikipedia bloqueia edição IPOG por notabilidade (em escalada)"
        - "R-009 — UTM/referrer LLM não capturado em GA4 (em escalada)"
        - "R-010 — Atraso lançamento produto MBA (em escalada)"
        - "R-011 — Saint Paul/EXAME estabiliza arquitetura web (mitigado)"
        - "R-012 — Vazamento informação confidencial (mitigado)"
        - "R-013 — Wikipedia/Reddit gap permite concorrentes citados mais que IPOG"
        - "R-014 — UniCesumar industrial 50 cursos/trimestre + matrícula contínua"
        - "R-015 — Decreto 12.456 segunda onda atinge lato sensu"
        - "R-016 — Edtechs convergentes (Vittude/Zenklub) viram concorrentes diretos"
        - "R-017 — Avanço regulatório do Decreto 12.456 para pós lato sensu"
        - "R-018 — M&A regional do cluster Psi pelos consolidadores"
        - "R-019 — Reação institucional CFP/CRPs contra MBA online em Psicologia"
    validations:
      required: true

  - type: textarea
    id: mitigacao
    attributes:
      label: Mitigação proposta
      description: "Descreva a ação concreta. Cross-link com `docs/05-risk-register.md` se já registrada."
    validations:
      required: true

  - type: textarea
    id: gatilho
    attributes:
      label: Gatilho de escalonamento
      description: "Quando esta mitigação não é suficiente, qual o próximo passo?"
      placeholder: "D-7: ...\nD-Day: ...\nD+7: ..."
    validations:
      required: true

  - type: dropdown
    id: kpis-afetados
    attributes:
      label: KPIs afetados (selecione todos aplicáveis)
      multiple: true
      options:
        - "KPI 1 — LLM Mention Rate"
        - "KPI 2 — Share-of-Voice"
        - "KPI 3 — Citation Quality Score"
        - "KPI 4 — Schema Coverage Score (NAIA)"
        - "KPI 5 — Cobertura fontes externas"
        - "KPI 6 — Velocidade fechamento P0"
        - "KPI 7 — Conversion Lift por canal LLM"
        - "KPI 8 — Delta pré/pós Schema"

  - type: dropdown
    id: owner-risco
    attributes:
      label: Owner da mitigação
      options:
        - "Alexandre Caramaschi"
        - "Bruno Azambuja"
        - "Ronan Maia"
        - "TI IPOG"
        - "Jurídico IPOG"
        - "Brasil GEO + IPOG (compartilhado)"
    validations:
      required: true
