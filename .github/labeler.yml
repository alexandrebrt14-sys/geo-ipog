# Configuracao do Auto-Labeler (actions/labeler@v5)
# Responsavel: Brasil GEO — Head: alexandrebrt14-sys
# Mapeamento: caminho alterado no PR -> label aplicada automaticamente.
# Labels usadas correspondem ao conjunto criado em Onda 1 das settings do repositorio.

"benchmarking":
  - changed-files:
      - any-glob-to-any-file: "audits/benchmarking/**"

"auditoria":
  - changed-files:
      - any-glob-to-any-file: "audits/**"

"content-piece":
  - changed-files:
      - any-glob-to-any-file: "content/**"

"framework":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/framework/**"
          - "docs/04-definicao-de-done.md"
          - "docs/05-risk-register.md"
          - "docs/06-marcos-criticos-2026.md"

"monitoramento":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/relatorios-semanais/**"
          - "docs/relatorios-mensais/**"
          - "docs/relatorios-trimestrais/**"
          - "docs/atas/**"
          - "dashboards/**"

"schema":
  - changed-files:
      - any-glob-to-any-file:
          - "audits/SCHEMA-PATTERNS.md"
          - "audits/schema-implementations/**"

"llms-txt":
  - changed-files:
      - any-glob-to-any-file:
          - "audits/LLMS-TXT-TEMPLATE.md"
          - "audits/llms-txt-versions/**"

"robots-waf":
  - changed-files:
      - any-glob-to-any-file:
          - "audits/ROBOTS-SITEMAP-CHECKLIST.md"
          - "audits/concorrentes-monitoring/**"
