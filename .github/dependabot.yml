version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "framework"
      - "monitoramento"
      - "dependencies"
    groups:
      site-security:
        applies-to: security-updates
        patterns:
          - "*"
      site-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "framework"
      - "monitoramento"
    groups:
      github-actions:
        patterns:
          - "*"
