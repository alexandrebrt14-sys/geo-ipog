version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "framework"
      - "monitoramento"
    groups:
      github-actions:
        patterns:
          - "*"
