name: "Epic"
description: "Issue guarda-chuva agregando múltiplas issues por tema"
title: "[Epic] <tema do epic>"
labels: ["type:roadmap", "priority:p1"]
body:
  - type: markdown
    attributes:
      value: |
        Epic é uma issue guarda-chuva que agrega múltiplas issues relacionadas ao mesmo tema/marco/vetor.
        Não fecha até que todas as sub-issues estejam fechadas.

  - type: input
    id: tema
    attributes:
      label: Tema do epic
      placeholder: "Pico GEO captação 2026.2 / Wikipedia + Wikidata IPOG / 51 unidades regionais operacionais / Voice Guard 2.0 / Trilha IA + Saúde Mental / B2B NR-1"
    validations:
      required: true

  - type: dropdown
    id: marco
    attributes:
      label: Marco vinculado
      options:
        - "M1 — Bootstrap (11-05 a 07-06)"
        - "M2 — Pré-pico 2026.2 (08-06 a 05-07)"
        - "M3 — Pico 2026.2 (06-07 a 16-08)"
        - "M4 — Pós-pico calibração (17-08 a 27-09)"
        - "M5 — Operação contínua (28-09 a 08-11)"
        - "M6 — Pré-pico 2027.1 (09-11 a 20-12)"
        - "M7 — Pico 2027.1 (21-12 a 28-02-2027)"
        - "M8 — Pós-pico 2027.1 (01-03-2027 em diante)"
    validations:
      required: true

  - type: dropdown
    id: vetor
    attributes:
      label: Vetor dominante
      options:
        - "V1 — GEO técnico"
        - "V2 — Engenharia de citação"
        - "V3 — Editorial HBR-grade"
        - "V4 — Autoridade externa"
        - "V5 — Moat regional"
        - "Transversal (vários vetores)"
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo declarado do epic
      description: "Resultado em 1 frase + KPI alvo"
      placeholder: |
        Objetivo: ...
        KPI alvo: KPI X = Y até DD-MM-YYYY
    validations:
      required: true

  - type: textarea
    id: subissues
    attributes:
      label: Sub-issues (lista checkbox)
      description: "Adicionar sub-issues conforme forem criadas. Epic só fecha quando todas estão fechadas."
      value: |
        - [ ] #X — descrição
        - [ ] #Y — descrição
    validations:
      required: true

  - type: textarea
    id: dod-epic
    attributes:
      label: Definition of Done do epic
      value: |
        - [ ] Todas as sub-issues fechadas
        - [ ] KPI alvo medido e documentado
        - [ ] Lições aprendidas documentadas
        - [ ] Lessons learned passadas para epic seguinte
        - [ ] Relatório mensal/marco com sumário do epic
    validations:
      required: true
