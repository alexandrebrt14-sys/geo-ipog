name: Gating decision IPOG
description: Registrar decisão executiva pendente de Bruno Azambuja ou Ronan Maia que bloqueia execução do programa GEO IPOG.
title: "[gating] "
labels: ["gating-ipog", "fonte-cliente", "prioridade-alta"]
body:
  - type: dropdown
    id: decisor
    attributes:
      label: Quem precisa decidir
      options:
        - Bruno Azambuja (operacional)
        - Ronan Maia (executivo)
        - Bruno + Ronan
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto da decisão
      description: Em 3-5 linhas, o que motivou a decisão. Incluir issue(s) bloqueada(s) por essa decisão.
    validations:
      required: true
  - type: textarea
    id: opcoes
    attributes:
      label: Opções avaliadas
      description: Liste as opções A, B, C com prós e contras. Recomendação Brasil GEO ao final.
    validations:
      required: true
  - type: input
    id: recomendacao
    attributes:
      label: Recomendação Brasil GEO
      placeholder: "Opção A — porque ..."
    validations:
      required: true
  - type: dropdown
    id: dependencias
    attributes:
      label: Issues bloqueadas por essa decisão
      description: Cole numeros das issues que ficam bloqueadas se a decisão atrasar (ex: 4, 7, 10).
      options:
        - Lista a preencher no body
    validations:
      required: false
  - type: input
    id: prazo
    attributes:
      label: Prazo limite para decisão
      placeholder: "YYYY-MM-DD"
      description: Após esse prazo, gatilho de escalonamento conforme docs/05-risk-register.md.
    validations:
      required: true
  - type: dropdown
    id: gatilho
    attributes:
      label: Gatilho de escalonamento se atrasar
      options:
        - D-7 status muda para "Em escalada" + e-mail direto
        - D-3 e-mail direto a Ronan Maia
        - D-Day recalibrar fase reduzindo escopo
        - D+5 replanejar fase seguinte
    validations:
      required: true
  - type: textarea
    id: impacto_kpi
    attributes:
      label: KPIs afetados pela decisão
      description: Quais dos 8 KPIs canônicos ficam comprometidos se a decisão atrasar. Cross-link com dashboards/METRICAS-CANONICAS.md.
  - type: textarea
    id: anexos
    attributes:
      label: Material de apoio
      description: Documentos, dossiês ou matrizes que sustentam a decisão. Ex - audits/benchmarking/SINTESE-EXECUTIVA.md.
